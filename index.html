<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ładowania Pytań</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .status { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        ul { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🧪 Test odczytu pytania.json</h1>
    <div id="status" class="status">Ładowanie danych...</div>

    <h2>Wczytane pytania:</h2>
    <ul id="questionsList"></ul>

    <p><a href="admin.html">Przejdź do admin.html</a></p>

    <script>
        async function loadTest() {
            const statusDiv = document.getElementById('status');
            const listDiv = document.getElementById('questionsList');

            try {
                // Wymuszenie braku pamięci podręcznej (cache)
                const response = await fetch('./pytania.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`Błąd HTTP: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();

                statusDiv.className = 'status success';
                statusDiv.innerText = `✅ Sukces! Plik odczytany poprawnie. Znaleziono pytań: ${data.length}`;

                listDiv.innerHTML = '';
                data.forEach(q => {
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>ID ${q.id}:</strong> ${q.question} — <em>(Odp: ${q.answer})</em>`;
                    listDiv.appendChild(li);
                });

            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerText = `❌ Błąd ładowania: ${err.message}`;
                console.error(err);
            }
        }

        loadTest();
    </script>
</body>
</html>
