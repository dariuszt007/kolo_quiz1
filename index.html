<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Ruletka / Quiz Wheel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f4f9;
      color: #333;
    }

    .top-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      background: #fff;
      cursor: pointer;
    }

    .nav-link {
      padding: 8px 16px;
      background-color: #34495e;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      align-items: center;
    }

    .reset-btn {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background-color: #e67e22;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .reset-btn:hover { background-color: #d35400; }

    .wheel-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin-top: 15px;
    }

    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #e74c3c;
      z-index: 10;
    }

    #canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    button.spin-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #2ecc71;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button.spin-btn:hover { background-color: #27ae60; }
    button.spin-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

    .quiz-box {
      margin-top: 20px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      display: none;
    }

    .question-content {
      cursor: pointer;
      user-select: none;
    }

    .hint {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 5px;
      margin-bottom: 10px;
    }

    .answer-box {
      margin-top: 15px;
      padding: 10px;
      background-color: #e8f8f5;
      border: 1px solid #2ecc71;
      border-radius: 6px;
      color: #27ae60;
      font-weight: bold;
      display: none;
    }

    .remove-option {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .empty-message {
      margin-top: 15px;
      color: #e74c3c;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <select id="lang-select" class="lang-select">
      <option value="pl">🇵🇱 Polski</option>
      <option value="en">🇬🇧 English</option>
      <option value="ja">🇯🇵 日本語</option>
    </select>
    <a id="admin-link" class="nav-link">⚙️ Panel edycji</a>
  </div>

  <h1 id="main-title">Quiz - Zakręć Kołem!</h1>

  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>

  <div class="controls-bar">
    <button id="spin-btn" class="spin-btn">Zakręć kołem!</button>
    <button id="reset-btn" class="reset-btn">🔄 Zacznij od nowa</button>
  </div>

  <div id="empty-msg" class="empty-message">Wszystkie pytania zostały wylosowane! Kliknij "Zacznij od nowa".</div>

  <div id="quiz-box" class="quiz-box">
    <div id="question-clickable" class="question-content">
      <h3 id="question-title">Pytanie</h3>
      <p id="question-text"></p>
      <div id="hint-text" class="hint">👇 Kliknij tutaj, aby zobaczyć odpowiedź</div>
      <div id="answer-box" class="answer-box"></div>
    </div>

    <div class="remove-option">
      <input type="checkbox" id="remove-check">
      <label for="remove-check" id="remove-label">Usuń to pytanie z koła po wylosowaniu</label>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "1111";

    const translations = {
      pl: {
        title: "Quiz - Zakręć Kołem!",
        adminLink: "⚙️ Panel edycji",
        spinBtn: "Zakręć kołem!",
        resetBtn: "🔄 Zacznij od nowa",
        hint: "👇 Kliknij tutaj, aby zobaczyć odpowiedź",
        answerPrefix: "Odpowiedź: ",
        noAnswer: "Brak zdefiniowanej odpowiedzi.",
        removeLabel: "Usuń to pytanie z koła po wylosowaniu",
        emptyMsg: "Wszystkie pytania zostały wylosowane! Kliknij \"Zacznij od nowa\".",
        passPrompt: "Podaj hasło do panelu edycji:",
        passError: "Niepoprawne hasło!"
      },
      en: {
        title: "Quiz - Spin the Wheel!",
        adminLink: "⚙️ Edit Panel",
        spinBtn: "Spin the wheel!",
        resetBtn: "🔄 Start over",
        hint: "👇 Click here to see the answer",
        answerPrefix: "Answer: ",
        noAnswer: "No answer defined.",
        removeLabel: "Remove this question from wheel",
        emptyMsg: "All questions have been drawn! Click \"Start over\".",
        passPrompt: "Enter password for admin panel:",
        passError: "Incorrect password!"
      },
      ja: {
        title: "クイズ - ルーレットを回そう！",
        adminLink: "⚙️ 編集パネル",
        spinBtn: "ルーレットを回す！",
        resetBtn: "🔄 最初からやり直す",
        hint: "👇 クリックして回答を表示",
        answerPrefix: "答え: ",
        noAnswer: "回答が設定されていません。",
        removeLabel: "この質問をルーレットから除外する",
        emptyMsg: "すべての質問が終了しました！「最初からやり直す」をクリックしてください。",
        passPrompt: "編集パネルのパスワードを入力してください:",
        passError: "パスワードが正しくありません！"
      }
    };

    const defaultQuestions = {
      pl: [
        { label: "Pytanie 1", color: "#3498db", text: "Jaka jest stolica Japonii?", answer: "Tokio" },
        { label: "Pytanie 2", color: "#e67e22", text: "Ile dni ma rok przestępny?", answer: "366 dni" },
        { label: "Pytanie 3", color: "#9b59b6", text: "Jaki jest największy ocean na Ziemi?", answer: "Ocean Spokojny (Pacyfik)" },
        { label: "Pytanie 4", color: "#f1c40f", text: "Kto napisał 'Pana Tadeusza'?", answer: "Adam Mickiewicz" }
      ],
      en: [
        { label: "Question 1", color: "#3498db", text: "What is the capital of Japan?", answer: "Tokyo" },
        { label: "Question 2", color: "#e67e22", text: "How many days are in a leap year?", answer: "366 days" },
        { label: "Question 3", color: "#9b59b6", text: "What is the largest ocean on Earth?", answer: "Pacific Ocean" },
        { label: "Question 4", color: "#f1c40f", text: "Who painted the Mona Lisa?", answer: "Leonardo da Vinci" }
      ],
      ja: [
        { label: "質問 1", color: "#3498db", text: "日本の首都はどこですか？", answer: "東京" },
        { label: "質問 2", color: "#e67e22", text: "うるう年は一年で何日ありますか？", answer: "366日" },
        { label: "質問 3", color: "#9b59b6", text: "地球上で最も広い大洋は何ですか？", answer: "太平洋" },
        { label: "質問 4", color: "#f1c40f", text: "モナ・リザを描いたのは誰ですか？", answer: "レオナルド・ダ・ヴィンチ" }
      ]
    };

    function detectBrowserLanguage() {
      const userLang = (navigator.language || navigator.userLanguage || "").toLowerCase();
      if (userLang.startsWith("ja")) return "ja";
      if (userLang.startsWith("en")) return "en";
      return "pl";
    }

    let currentLang = localStorage.getItem("quizLang") || detectBrowserLanguage();
    let allQuestions = [];
    let activeQuestions = [];
    let currentSelectedIndex = null;

    const langSelect = document.getElementById("lang-select");
    const mainTitle = document.getElementById("main-title");
    const adminLink = document.getElementById("admin-link");
    const spinBtn = document.getElementById("spin-btn");
    const resetBtn = document.getElementById("reset-btn");
    const hintText = document.getElementById("hint-text");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const quizBox = document.getElementById("quiz-box");
    const questionClickable = document.getElementById("question-clickable");
    const questionTitle = document.getElementById("question-title");
    const questionText = document.getElementById("question-text");
    const answerBox = document.getElementById("answer-box");
    const removeCheck = document.getElementById("remove-check");
    const removeLabel = document.getElementById("remove-label");
    const emptyMsg = document.getElementById("empty-msg");

    let currentAngle = 0;
    let isSpinning = false;

    function applyLanguage(lang) {
      currentLang = lang;
      localStorage.setItem("quizLang", lang);
      langSelect.value = lang;

      const t = translations[lang];
      mainTitle.innerText = t.title;
      adminLink.innerText = t.adminLink;
      spinBtn.innerText = t.spinBtn;
      resetBtn.innerText = t.resetBtn;
      hintText.innerText = t.hint;
      removeLabel.innerText = t.removeLabel;
      emptyMsg.innerText = t.emptyMsg;

      resetWheel();
    }

    function resetWheel() {
      allQuestions = JSON.parse(localStorage.getItem("quizQuestions_" + currentLang)) || defaultQuestions[currentLang];
      activeQuestions = [...allQuestions];
      quizBox.style.display = "none";
      answerBox.style.display = "none";
      emptyMsg.style.display = "none";
      spinBtn.disabled = false;
      drawWheel();
    }

    function drawWheel() {
      const numSegments = activeQuestions.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numSegments === 0) {
        spinBtn.disabled = true;
        emptyMsg.style.display = "block";
        return;
      }

      emptyMsg.style.display = "none";
      spinBtn.disabled = false;

      const arcSize = (2 * Math.PI) / numSegments;
      const radius = canvas.width / 2;

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = activeQuestions[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius, angle, angle + arcSize);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Arial";
        ctx.fillText(activeQuestions[i].label, radius - 20, 6);
        ctx.restore();
      }
    }

    function spin() {
      if (isSpinning || activeQuestions.length === 0) return;

      // Jeśli wybrano usunięcie poprzedniego pytania, usuwamy je przed nowym losem
      if (currentSelectedIndex !== null && removeCheck.checked) {
        activeQuestions.splice(currentSelectedIndex, 1);
        currentSelectedIndex = null;
        if (activeQuestions.length === 0) {
          quizBox.style.display = "none";
          drawWheel();
          return;
        }
      }

      removeCheck.checked = false;
      isSpinning = true;
      spinBtn.disabled = true;
      quizBox.style.display = "none";
      answerBox.style.display = "none";

      const spinAngle = Math.random() * 2000 + 3000;
      const spinTime = 4000;
      let start = null;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = timestamp - start;
        const easeOut = 1 - Math.pow(1 - Math.min(progress / spinTime, 1), 3);

        currentAngle = (spinAngle * (Math.PI / 180) * easeOut) % (2 * Math.PI);
        drawWheel();

        if (progress < spinTime) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const numSegments = activeQuestions.length;
      const degrees = (currentAngle * 180 / Math.PI) % 360;
      const pointerAngle = (270 - degrees + 360) % 360;
      currentSelectedIndex = Math.floor(pointerAngle / (360 / numSegments));

      const selected = activeQuestions[currentSelectedIndex];
      const t = translations[currentLang];

      questionTitle.innerText = selected.label;
      questionText.innerText = selected.text;
      answerBox.innerText = t.answerPrefix + (selected.answer || t.noAnswer);
      answerBox.style.display = "none";
      quizBox.style.display = "block";
    }

    questionClickable.addEventListener("click", () => {
      answerBox.style.display = (answerBox.style.display === "none") ? "block" : "none";
    });

    adminLink.addEventListener("click", (e) => {
      e.preventDefault();
      const t = translations[currentLang];
      const enteredPassword = prompt(t.passPrompt);

      if (enteredPassword === ADMIN_PASSWORD) {
        sessionStorage.setItem("quizAdminAuth", "true");
        window.location.href = "admin.html";
      } else if (enteredPassword !== null) {
        alert(t.passError);
      }
    });

    langSelect.addEventListener("change", (e) => applyLanguage(e.target.value));
    spinBtn.addEventListener("click", spin);
    resetBtn.addEventListener("click", resetWheel);

    applyLanguage(currentLang);
  </script>
</body>
</html>
